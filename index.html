<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>RANKING</title>
        <link rel="stylesheet" href="./index.css" />
    </head>
    <body>
        <h1 class="title">
            <button class="button" type="button" command="show-modal" commandfor="ui"><h1 class="title">RANKING</h1></button>
        </h1>
        <div id="table"></div>

        <dialog id="ui">
            <div style="text-align: center">
                <div class="input">
                    <form action="javascript:addPlayer()">
                        <input id="nameInput" type="text" placeholder="name" required maxlength="8" />
                        <input id="scoreInput" type="number" placeholder="point" required min="0" max="9999999" />
                        <input type="submit" value="追加" />
                    </form>
                </div>
            </div>
        </dialog>
        <script src="./index.js"></script>
    </body>
</html>
